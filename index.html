<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZONE STORE | بوابة تقارير الإدارة والأونرات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #f4f5f7;
            --bg-card: rgba(255, 255, 255, 0.9);
            --silver-light: #e2e8f0;
            --silver-mid: #94a3b8;
            --silver-dark: #475569;
            --charcoal: #1e293b;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(71, 85, 105, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--charcoal);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* زينة الخلفية الهندسية بالرصاصي والأبيض */
        .bg-decor {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(148, 163, 184, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(100, 116, 139, 0.15) 0%, transparent 45%),
                linear-gradient(to right, rgba(203, 213, 225, 0.25) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(203, 213, 225, 0.25) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 35px 35px, 35px 35px;
        }

        .floating-shape {
            position: fixed;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            opacity: 0.5;
            z-index: -1;
            animation: float 8s ease-in-out infinite;
        }

        .shape-1 { width: 220px; height: 220px; top: -50px; right: -50px; }
        .shape-2 { width: 160px; height: 160px; bottom: 5%; left: -40px; animation-delay: 3s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* الهيدر */
        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--silver-light);
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #64748b, #cbd5e1);
            color: var(--white);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 10px rgba(100, 116, 139, 0.3);
        }

        .brand-text h1 {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--charcoal);
            letter-spacing: 0.5px;
        }

        .brand-text span {
            font-size: 0.8rem;
            color: var(--silver-dark);
            font-weight: 600;
        }

        .status-badge {
            background: var(--white);
            border: 1px solid var(--silver-light);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--silver-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #64748b;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(100, 116, 139, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(100, 116, 139, 0); }
            100% { box-shadow: 0 0 0 0 rgba(100, 116, 139, 0); }
        }

        /* المحتوى الرئيسي */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome-box {
            text-align: center;
            margin-bottom: 45px;
            background: var(--bg-card);
            padding: 35px 30px;
            border-radius: 24px;
            border: 1px solid var(--white);
            box-shadow: var(--shadow);
            width: 100%;
            position: relative;
        }

        .welcome-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #94a3b8, #475569);
            border-radius: 0 0 10px 10px;
        }
